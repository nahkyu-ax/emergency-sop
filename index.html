<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOP 바로보기</title>
<style>
:root{
  --paper:#F2F5F9; --card:#FFFFFF; --ink:#0E1726; --muted:#56667D; --line:#D9E1EB;
  --navy:#12305A; --navy2:#0B2142;
  --fire:#D62828; --go:#1565D8; --ok:#1E8E5A; --amber:#E59A00;
  --script-bg:#FFF4CF; --script-bar:#E59A00;
  --shadow:0 12px 30px rgba(14,23,38,.13);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1420; --card:#162133; --ink:#EEF2F8; --muted:#9AA9BE; --line:#36486B;
    --navy:#0A1B33; --navy2:#06122A;
    --fire:#FF5B5B; --go:#4A92FF; --ok:#3CC487; --amber:#FFC23D;
    --script-bg:#3A3015; --script-bar:#FFC23D;
    --shadow:0 12px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1420; --card:#162133; --ink:#EEF2F8; --muted:#9AA9BE; --line:#36486B;
  --navy:#0A1B33; --navy2:#06122A;
  --fire:#FF5B5B; --go:#4A92FF; --ok:#3CC487; --amber:#FFC23D;
  --script-bg:#3A3015; --script-bar:#FFC23D;
  --shadow:0 12px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper)}
body{font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--go);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:560px;margin:0 auto}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ───── 상단 머리 ───── */
.top{background:var(--navy);color:#fff;padding:16px 18px 14px}
.top .row{display:flex;align-items:center;gap:10px}
.top img.totta{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:50%;padding:4px;flex:none}
.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1.2;white-space:nowrap}
.top p{margin:2px 0 0;font-size:13px;color:#BFD0E6;white-space:nowrap}
.top .stn{margin-left:auto;flex:0 1 auto;min-width:0;max-width:44%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 12px;font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linebar{display:flex;height:5px}
.linebar span{flex:1}

/* ───── 홈 ───── */
.home{padding:20px 16px 40px}
.ask{font-size:26px;font-weight:900;letter-spacing:-.6px;margin:6px 4px 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;min-height:128px;display:flex;flex-direction:column;gap:8px}
.tile .ring svg{width:62%;height:62%;fill:currentColor}
.tile .ring{width:54px;height:54px;border-radius:50%;border:6px solid var(--c);display:grid;place-items:center;font-size:24px;background:var(--card)}
.tile b{font-size:21px;font-weight:900;letter-spacing:-.4px}
.tile small{font-size:14px;color:var(--muted)}
.tile.main{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;min-height:112px;border-color:var(--c);box-shadow:var(--shadow)}
.tile.top2{min-height:124px;border-color:var(--c);box-shadow:var(--shadow)}
.tile.top2 .ring{width:60px;height:60px;border-width:7px}
.tile.top2 b{font-size:21px}
.tile.main .ring{width:68px;height:68px;font-size:30px;border-width:8px;flex:none}
.tile.main{min-height:98px}
.tile.main b{font-size:28px}
.grp{font-size:16px;font-weight:900;color:var(--muted);margin:20px 4px 8px}
.tile:not(.main){min-height:104px}
.tile:not(.main) b{font-size:19px}
.tile:not(.main) .ring{width:46px;height:46px;border-width:5px;font-size:21px}
.rpt{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:break-all;max-height:34vh;overflow:auto}
.rpt.big{max-height:56vh;font-size:15px}
.mergebox{margin:10px 0 0;border:2px dashed var(--line);border-radius:14px;padding:10px 12px}
.mergebox summary{font-size:16px;font-weight:800;color:var(--go);cursor:pointer}
.mergebox textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:15px;font-family:inherit;line-height:1.5;resize:vertical}
.hits{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-height:280px;overflow:auto}
.hits button{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px;font-weight:700;text-align:left}
.hits button span{font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap}
.vids{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.vid{display:flex;align-items:center;gap:10px;background:#111;color:#fff;border:0;border-radius:14px;padding:13px 15px;font-size:18px;font-weight:800;text-align:left;width:100%}
.vid span{margin-left:auto;font-size:13px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px}
.manlist{display:flex;flex-direction:column;gap:7px;max-height:56vh;overflow:auto}
.manlist button{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:16px;font-weight:700;line-height:1.4}
.segtab{display:flex;gap:6px;margin:0 0 10px}
.segtab button{flex:1;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:9px;font-size:15px;font-weight:800;color:var(--muted)}
.segtab button.on{background:var(--go);border-color:var(--go);color:#fff}
.logstat{display:flex;gap:8px;margin-bottom:12px}
.logstat div{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.logstat b{display:block;font-size:20px;font-weight:900}
.logstat span{font-size:13px;color:var(--muted)}
.logs{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.logwrap{display:flex;align-items:stretch;gap:6px}
.logdel{flex:none;width:40px;background:var(--paper);border:2px solid var(--line);border-radius:12px;color:var(--muted);font-size:17px;font-weight:800}
.logrow{flex:1;display:flex;flex-direction:column;gap:3px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.logrow .l1{font-size:18px;font-weight:800}
.logrow .l2{font-size:14px;color:var(--muted)}
.logrow .l3{font-size:15px;font-weight:800}
.logrow .l3.good{color:var(--ok)} .logrow .l3.bad{color:var(--fire)}
.vlist{display:flex;flex-direction:column;gap:8px}
.vlist a,.vlist .no{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:13px 15px;font-size:18px;font-weight:700;text-decoration:none;color:var(--ink)}
.vlist .no{color:var(--muted);border-style:dashed}
.links{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.links button{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:18px;font-weight:700;text-align:left}
.book a,.book .none{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:17px}
.book a b{font-variant-numeric:tabular-nums;color:var(--go)}
.book .none span{color:var(--muted);font-size:15px}
.peeklist div{padding:10px 0;border-bottom:1px solid var(--line)}
.peeklist b{display:block;font-size:17px}
.peeklist span{font-size:15px;color:var(--muted)}
.tile[disabled]{opacity:.55;cursor:not-allowed}
.tile .soon{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;background:var(--line);color:var(--muted);border-radius:999px;padding:3px 9px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.panel h3{margin:0 0 6px;font-size:17px}
.panel p{margin:0;color:var(--muted);font-size:16px}
.link{background:none;border:0;color:var(--go);font-weight:700;padding:8px 0;font-size:16px}
.warn{border-color:var(--amber);background:var(--script-bg)}
.subrow{display:flex;gap:8px;margin-top:16px}
.subrow button{flex:1;background:none;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:10px 8px;font-size:14px;font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}

/* ───── 역할 선택 ───── */
.sec{padding:18px 16px 130px}
.sec h2{font-size:24px;font-weight:900;margin:4px 4px 4px;letter-spacing:-.5px}
.sec .lead{margin:0 4px 18px;color:var(--muted);font-size:16px}
.label{font-size:16px;font-weight:700;color:var(--muted);margin:18px 4px 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 0;font-size:21px;font-weight:900}
.seg button[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--go) 35%,transparent)}
.trainSw{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.trainSw .sw{flex:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.trainSw .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.trainSw[aria-pressed="true"]{border-color:var(--ok)}
.trainSw[aria-pressed="true"] .sw{background:var(--ok)}
.trainSw[aria-pressed="true"] .sw::after{transform:translateX(20px)}
.trainSw b{display:block;font-size:19px}
.trainSw small{display:block;font-size:14px;color:var(--muted);line-height:1.4;margin-top:2px}
.roles{display:flex;flex-direction:column;gap:10px}
.rolecard{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.rolecard .badge{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:900;background:var(--paper);border:3px solid var(--line)}
.rolecard b{display:block;font-size:20px}
.rolecard>span:last-child{color:var(--ink)}
.rolecard span span{display:block;font-size:15px;color:var(--muted);line-height:1.4}
.rolecard em{font-style:normal;font-size:14px;font-weight:700;color:var(--go)}
.rolecard[aria-pressed="true"]{border-color:var(--fire);box-shadow:var(--shadow)}
.rolecard[aria-pressed="true"] .badge{background:var(--fire);border-color:var(--fire);color:#fff}

/* ───── 하단 고정 버튼 ───── */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.peek{max-width:560px;margin:0 auto 10px;display:flex;align-items:center;gap:8px;font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden}
.peek b{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.peek .n{flex:none;font-size:13px;font-weight:900;border:2px solid var(--rail-after);color:var(--fire);border-radius:999px;padding:1px 8px}
.btn{border:0;border-radius:16px;font-weight:900;font-size:22px;padding:0 18px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.go{flex:1;background:var(--go);color:#fff}
.btn.fire{flex:1;background:var(--fire);color:#fff}
.btn.okb{flex:1;background:var(--ok);color:#fff}
.btn.ghost{background:var(--paper);border:2px solid var(--line);color:var(--ink);font-size:18px;min-width:64px;padding:0 14px}
.btn.wide{width:100%}
.resumeRow{display:flex;gap:8px;margin:10px 0 2px}
.btn.restart{flex:none;min-height:56px;border-radius:14px;font-size:16px;padding:0 14px}
.btn.two2{flex-direction:column;gap:2px;min-height:62px;padding:10px 14px;font-size:18px;line-height:1.25}
.btn.two2 small{font-size:14px;font-weight:600;opacity:.92}
.btn.two{font-size:16px;line-height:1.2;padding:0 8px}
.btn.resume{flex:1;font-size:17px;white-space:nowrap;padding:0 10px;letter-spacing:-.4px;min-height:56px;border-radius:14px;margin:10px 0 2px}
@media (max-width:370px){.btn.resume{font-size:15px}}
.btn small{font-size:15px;font-weight:700;opacity:.85}

/* ───── 진행 화면 ───── */
.runhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--navy);color:#fff}
.runhead .r1{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.runhead .who{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.tbadge{display:inline-block;background:#E59A00;color:#1A1200;font-size:12px;font-weight:900;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.script.train{border-left-color:#B45309;background:color-mix(in srgb,#E59A00 16%,var(--card))}
.runhead .who svg.hico{width:19px;height:19px;fill:#fff;vertical-align:-3px;margin-right:5px}
.runhead .who > b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu.home{width:44px;display:grid;place-items:center;padding:0}
.menu.home svg{width:32px;height:32px;fill:#fff;display:block}
.runhead .r1{gap:8px!important;padding:10px 10px 8px!important}
.tabs{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto}
.tabs .tab{flex:none;background:rgba(255,255,255,.1);border:2px solid transparent;color:#C9D6E8;border-radius:999px;padding:6px 13px;font-size:15px;font-weight:800;white-space:nowrap}
.tabs .tab.on{background:var(--c);border-color:#fff;color:#fff}
.tabs .tab.fin{opacity:.6}
.runhead .who b{font-size:19px;font-weight:900;white-space:nowrap}
.runhead .who span{font-size:14px;color:#BFD0E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{margin-left:auto;flex:none;border-radius:13px;padding:5px 9px;text-align:right;background:var(--go);transition:background .3s}
.clock.over{background:var(--fire)}
.clock .t{font-size:26px;font-weight:900;line-height:1.05;letter-spacing:-.5px}
.clock .b{font-size:12px;font-weight:700;opacity:.95;white-space:nowrap}
.menu{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:12px;width:42px;height:42px;font-size:21px;font-weight:900;flex:none}
.info{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto}
.info button{flex:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700}
.info button.empty{border-style:dashed;color:#BFD0E6}

.track{padding:14px 12px 190px}
.band{display:flex;align-items:center;gap:10px;margin:8px 0 6px 6px}
.band .pill{font-size:15px;font-weight:900;border-radius:999px;padding:5px 12px;background:var(--card);border:2px solid var(--line)}
.band .st{font-size:14px;font-weight:700;color:var(--muted)}
.band.over .pill{border-color:var(--fire);color:var(--fire)}
.band.over .st{color:var(--fire)}
.band.clear .pill{border-color:var(--ok);color:var(--ok)}
.band.clear .st{color:var(--ok)}

.stop{display:grid;grid-template-columns:34px 1fr;gap:8px;position:relative}
.stop .rail{position:relative;display:flex;justify-content:center}
.stop .rail::before{content:"";position:absolute;top:0;bottom:0;width:6px;background:var(--rail-after);border-radius:3px}
.stop.done .rail::before,.stop.current .rail::before{background:var(--fire)}
.stop.current .rail::after{content:"";position:absolute;top:34px;bottom:0;width:6px;background:var(--rail-after);border-radius:3px}
.dot{position:relative;z-index:1;margin-top:14px;width:20px;height:20px;border-radius:50%;background:var(--card);border:4px solid var(--rail-after);display:grid;place-items:center;font-size:11px;color:#fff;font-weight:900}
.stop.done .dot{background:var(--fire);border-color:var(--fire)}
.stop.current .dot{margin-top:18px;width:32px;height:32px;border:7px solid var(--fire);background:var(--card)}
:root{--rail-after:#F2B9B9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rail-after:#5A2A2E}}
:root[data-theme="dark"]{--rail-after:#5A2A2E}

.card{background:var(--card);border-radius:14px;margin:6px 0;border:1px solid var(--line)}
.stop.done .card{background:transparent;border-color:transparent;padding:8px 6px;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;width:100%}
.stop.done .card .tt{font-size:16px;color:var(--muted);flex:1}
.stop.done .card .when{font-size:14px;color:var(--muted);font-weight:700}
.stop.done .card .chosen{font-size:13px;font-weight:700;color:var(--ink);background:var(--paper);border-radius:999px;padding:2px 8px}
.stop.up .card{padding:10px 14px;display:flex;align-items:center;gap:10px}
.stop.up .card .tt{font-size:18px;font-weight:700}
.stop.up.far .card{opacity:.6}
.stop.up.far .card .tt{font-size:16px}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:900;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card));border-radius:999px;padding:3px 10px;white-space:nowrap}

.stop.current .card{border:2px solid var(--fire);box-shadow:var(--shadow);padding:16px 16px 18px;margin:8px 0 10px}
.cur-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cur-top .step{margin-left:auto;font-size:14px;font-weight:700;color:var(--muted)}
.cur-title{display:flex;gap:12px;align-items:flex-start;margin:12px 0 4px}
.ic.svgic svg{width:72%;height:72%;fill:var(--c)}
.ic.svgic{display:grid;place-items:center}
.cur-title .ic{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--c) 13%,var(--card))}
.cur-title h2{margin:2px 0 0;font-size:28px;line-height:1.25;font-weight:900;letter-spacing:-.7px}
.cur-title h2.long{font-size:24px;line-height:1.25}
.cur-detail{font-size:19px;margin:8px 0 0;color:var(--ink)}
.steptimer{display:flex;align-items:baseline;gap:8px;margin-top:12px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:9px 13px}
.steptimer .n{font-size:26px;font-weight:900;letter-spacing:-.5px}
.steptimer .g{font-size:15px;font-weight:700;color:var(--muted)}
.steptimer .m{margin-left:auto;font-size:14px;font-weight:700;color:var(--muted);text-align:right;line-height:1.3}
.steptimer.over{border-color:var(--fire);background:color-mix(in srgb,var(--fire) 10%,var(--card))}
.steptimer.over .n,.steptimer.over .m{color:var(--fire)}
.important{margin-top:10px;font-size:16px;font-weight:700;color:var(--fire);display:flex;gap:6px}
.checks{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.plainlist{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.plainlist li{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:19px;font-weight:700}
.plainlist li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}
.checks button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px;font-size:19px;font-weight:700}
.checks .box{flex:none;width:30px;height:30px;border-radius:8px;border:3px solid var(--muted);display:grid;place-items:center;font-size:18px;color:#fff}
.checks button[aria-pressed="true"]{border-color:var(--ok)}
.checks button[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.checks button[aria-pressed="true"] .lbl{color:var(--muted);text-decoration:line-through}
.script{margin-top:14px;background:var(--script-bg);border-left:6px solid var(--script-bar);border-radius:10px;padding:12px 14px}
.script .kind{font-size:14px;font-weight:900;color:var(--ink);opacity:.75;margin-bottom:4px}
.script .txt{font-size:21px;line-height:1.62;font-weight:500}
.also{margin-top:10px;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:16px;font-weight:700;color:var(--muted)}
.script .en{margin-top:10px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--ink) 25%,transparent);font-size:17px;opacity:.8;line-height:1.5}
.tok{font-weight:900;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.blank{font-weight:900;background:rgba(229,154,0,.28);border-radius:4px;padding:0 3px}
.draft{margin-top:6px;font-size:13px;opacity:.75}
.callgrp{margin:8px 0 4px;font-size:14px;font-weight:800;color:var(--muted)}
.calls{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.call{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--card);border-radius:14px;padding:12px 14px;text-decoration:none;min-height:60px;text-align:left;width:100%}
.call .who{flex:1;display:flex;flex-direction:column;line-height:1.3}
.call .who b{font-size:19px}
.call .who span{font-size:15px;opacity:.75}
.call .ph{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.92)}
.call.missing .ph{background:var(--paper);font-weight:900}
.call.missing{background:transparent;color:var(--ink);border:2px dashed var(--muted)}
.cur-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.srcbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--muted)}
.nudge{margin-top:10px;font-size:16px;font-weight:700;color:var(--fire)}

/* ───── 완료 ───── */
.done-hero{text-align:center;padding:26px 16px 8px}
.done-hero img{width:130px}
.done-hero .multi{margin:4px 0 0;font-size:17px;font-weight:800;color:var(--muted)}
.done-hero h2{font-size:28px;font-weight:900;margin:10px 0 2px}
.done-hero p{margin:0;color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 16px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.sum b{display:block;font-size:15px;color:var(--muted)}
.sum span{font-size:20px;font-weight:900}
.sum .bad{color:var(--fire)} .sum .good{color:var(--ok)}
.log{margin:0 16px 140px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.log div{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.log div:last-child{border-bottom:0}
.log time{flex:none;font-weight:900;width:84px}
.log em{font-style:normal;color:var(--muted);font-size:14px}

/* ───── 아래에서 올라오는 창 ───── */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(6,14,26,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .pnl{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:22px;font-weight:900;margin:2px 0 12px}
.sheet h4{font-size:16px;color:var(--muted);margin:18px 0 8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:15px;font-weight:700;color:var(--muted)}
.field input,.field select{font:inherit;font-size:19px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.adj{display:flex;flex-direction:column;gap:8px}
.adj .r{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center}
.adj .r b{font-size:17px}
.adj .r small{display:block;font-size:13px;color:var(--muted)}
.adj .r small b{font-weight:900}
.adj input{font:inherit;font-size:17px;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid button,.pick button{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 0;font-size:19px;font-weight:900}
.grid button[aria-pressed="true"],.pick button[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--go) 35%,transparent)}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{padding:12px 18px}
.crew{display:flex;flex-direction:column;gap:8px}
.crew .r{display:grid;grid-template-columns:1fr 112px 56px 40px;gap:6px;align-items:center}
.crew input,.crew select{font:inherit;font-size:17px;padding:10px 8px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:100%;min-width:0}
.crew .me{border:2px solid var(--line);border-radius:10px;padding:10px 0;font-size:15px;font-weight:900;background:var(--paper)}
.crew .me[aria-pressed="true"]{background:var(--fire);border-color:var(--fire);color:#fff}
.crew .del{border:0;background:none;font-size:22px;color:var(--muted)}
.preview{margin-top:12px;background:var(--paper);border-radius:12px;padding:12px;font-size:16px}
.preview div{padding:3px 0}
.mtbl-wrap{margin:0 0 14px}
.mtbl-t{margin:0 0 8px;font-size:15px;font-weight:800;color:var(--muted)}
.mtbl{border-collapse:collapse;font-size:14px;line-height:1.45;width:100%;background:var(--card);table-layout:fixed}
.mtbl th,.mtbl td{border:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
.mtbl th:nth-child(1),.mtbl th:nth-child(2){font-size:12.5px;padding:7px 2px}
.mtbl th{background:var(--paper);font-weight:800;font-size:14px;text-align:center;white-space:nowrap}
.mtbl .c-t{width:50px;text-align:center;font-weight:800;background:var(--paper);font-size:11.5px;word-break:keep-all;padding:7px 3px;line-height:1.35}
.mtbl .c-w{width:52px;text-align:center;font-weight:800;font-size:11.5px;word-break:keep-all;padding:7px 3px;line-height:1.35}
.mtbl .c-d span{display:block}
.mtbl .c-d span.on{background:color-mix(in srgb,var(--go) 22%,transparent);border-radius:4px;padding:1px 4px;margin:1px -4px;font-weight:800}
.mtbl .c-d span{word-break:keep-all}
.mtbl .c-d .nn{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--muted);font-size:12.5px}
.srcitem{background:var(--paper);border-radius:12px;padding:12px;margin-bottom:10px}
.srcitem b{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.srcitem p{margin:0;font-size:17px;white-space:pre-line}
.menulist{display:flex;flex-direction:column;gap:8px}
.menulist button{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:19px;font-weight:700}
.menulist button.danger{color:var(--fire)}

.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.ch{border:0;border-radius:16px;padding:14px 16px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:2px;min-height:64px;justify-content:center}
.ch b{font-size:22px;font-weight:900}
.ch span{font-size:15px;opacity:.9}
.ch.okb{background:var(--ok)} .ch.go{background:var(--go)} .ch.fire{background:var(--fire)}
.verify{margin-top:10px;font-size:15px;font-weight:700;color:#8A5A00;background:var(--script-bg);border-radius:8px;padding:6px 10px}
.hint{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:17px;font-weight:700}
.stop.pend .dot{background:var(--amber);border-color:var(--amber);color:#fff}
.stop.pend .card{background:var(--script-bg);border:2px dashed var(--amber);padding:10px 12px;display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.stop.pend .card .tt{flex:1;font-size:17px;font-weight:700}
.pendtag{font-size:13px;font-weight:900;color:#8A5A00}
.pendbtn{margin-left:auto;flex:none;border:0;background:var(--amber);color:#fff;font-weight:900;font-size:14px;border-radius:999px;padding:4px 12px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:999px;font-size:16px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}

@keyframes arrive{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
.stop.current .card{animation:arrive .28s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"><div class="pnl" id="sheetPanel"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

  m1bc:{doc:MAN+" · 1 · 안내방송", text:"〔경보음 2~3초 울림〕(열차탈선, 열차추돌, 차량고장 3회 반복)\n우리역 열차탈선(추돌, 차량고장 등)으로 운행이 지연(중단)되고 있으니 ○○ 방면 승객께서는 직원 안내에 따라 다른 교통편을 이용하여 주시고 주변에 교통약자가 계시면 도움을 주시기 바랍니다. 이용에 불편을 드려 죄송합니다."},

  /* ── 3 역사 화재 ── */
  m3:{doc:MAN+" · 3 역사 화재 · 사고전개/초동조치", text:"H+5분(황금시간)\n상황보고/전파 : 관제센터 보고, 119 신고(초기대응팀 가동), 안내방송, 인접역 및 환승역 통보\n기기 비상조치 : 게이트 비상모드 전환 확인(필요 시 수동 취급), 제연설비 가동 확인(관제 가동 요청 또는 수동 취급), 수막설비 가동(승강장 화재 시), 승강설비(E/L, E/S) 운행정지 확인\n장비 휴대 출동 : 공기호흡기, 통신장비, 승강장안전문 키, 랜턴 등\n초동조치 : 소화기, 소화전 사용 초기진화\n ※ 소화전 이용 시 전기시설물 유의\n - 배터리 화재는 초기진화 불가한 경우 진화생략, 초기진화 가능한 경우 냉각조치\n - [기능실 소화제(CO2, 할론 등) 외부방출시] 교통약자 편의시설(화장실, 수유실) 재실확인 및 출입통제\n응급구호 및 대피유도\n ※ 터널 대피가 필요한 경우 관제 승인(지시) 요청 후 대피 유도(승강장안전문 개방) 및 인접역 통보\n[H+5분~H+30분] 진화활동 : 소화기·소화전 사용 진화(119 현장인계 전까지 지속) - 배터리 화재의 경우 진화 생략\n구호·대피유도 : 응급구호 및 대피 유도(지속), 교통약자 편의시설(화장실, 수유실) 재실 확인 및 출입통제(단, 119통제구역 내는 119에 확인요청), 비상사다리 설치(필요 시)\n현장안내 : 안내방송(관제센터 방송 전까지 지속), 119 등 유관기관 도착 시 현장안내\n[H+30분~H+1시간] 조치여부 확인 : 119소방대에 완전 진화 여부 확인, 관련부서와 영업재개 및 현장보존 여부 협의, 교통약자 편의시설 재실 확인\n영업재개 준비 : 시설물 점검, 기기 작동 여부 및 피해상황 확인, 역사 환경정비\n영업재개 : 영업재개 안내방송, 영업재개 인접(환승)역 통보, 운임반환 및 안내\n[H+2시간 이후] 상황보고 : 피해상황 등 상황보고"},
  order:{doc:"앱 안내", text:"매뉴얼 3번 H+30분~H+1시간 칸의 「교통약자 편의시설 재실 확인」은 표에서 「직원2 이상」 라벨이 세로로 걸쳐 있어 어느 쪽 임무인지 글로는 가려지지 않습니다.\n이 앱은 실제로 현장을 도는 직원2·3의 임무로 보고, 직원1 화면에는 넣지 않았습니다. 직원2·3의 H+30분 임무에 재실확인·출입통제가 들어 있습니다."},
  m3p:{doc:MAN+" · 3 역사 화재 · 개인별 조치임무", text:"[황금시간 H+5분]\n직원1 : 관제센터 보고 및 119 신고(초기대응팀 가동), 안내방송, 기기 비상조치(게이트 비상모드 전환 확인, 제연설비 가동 확인, 수막설비 가동, 승강설비 운행정지 확인), 인접역 및 환승역 통보\n ※ 4인 이상 근무 시에는 「기기 비상조치 및 인접·환승역 통보」 임무를 직원4가 수행 → 이후 직원4는 구호 및 대피유도\n직원2,3 : 장비 휴대 출동(공기호흡기, 통신장비, 승강장안전문 키, 랜턴 등), 소화기·소화전 사용 초기진화\n - 배터리 화재는 초기진화 불가한 경우 진화생략, 초기진화 가능한 경우 냉각조치\n ※ 소화전 이용 시 전기시설물 유의\n - [기능실 소화제(CO2, 할론 등) 외부방출시] 교통약자 편의시설 재실확인 및 출입통제 임무로 대체\n직원4 이상·사복요원·자회사 직원 : 응급구호 및 대피유도 - 교통약자 피난보조 등\n[H+5분~H+30분] 직원1 : 안내방송(관제센터 방송 전까지 지속), 119 등 유관기관 도착 시 현장안내\n직원2,3 : 소화기·소화전 사용 진화(지속), 화재현장 119 인계 / (화재현장 119 인계 후) 교통약자 편의시설 재실확인·출입통제 및 응급구호·대피유도 임무로 전환 ※ 화재(119 통제)구역 내 재실확인은 119에 요청\n직원4 이상 : 대피유도 및 응급구호(지속), 비상사다리 설치(필요 시)\n[H+30분~H+1시간] 직원1 : 119에 완전 진화 여부 확인, 관련부서와 영업재개 및 현장보존 여부 협의, 교통약자 편의시설 재실 확인\n직원2 이상 : 영업재개 준비(시설물 점검, 기기 정상작동 여부 및 피해상황 확인, 역사 환경정비), 영업재개(안내방송, 운임반환 및 승객 안내, 인접 역 연동 및 환승역 통보)\n[H+2시간 이후] 직원1 : 피해상황 등 상황보고"},
  m3bc:{doc:MAN+" · 3 역사 화재 · 안내방송", text:"〔경보음 2~3초 울림〕역사 화재발생(3회 반복)\n우리역 ○○지점에 화재가 발생하였습니다. 승객 여러분께서는 직원 안내에 따라 신속히 대피해 주시기 바라며 주변에 교통약자가 계시면 도움을 주시기 바랍니다. 발화지점 승객께서는 직원과 함께 주변 소화기로 초동진화에 협조하여 주시기 바랍니다."},
  m3end:{doc:MAN+" · 3 역사 화재 · 영업재개 안내방송", text:"“우리역 ○○지점 화재는 조치 완료되어 ○○시 ○○분부터 열차가 정상 운행될 예정입니다.”"},

  /* ── 4 승강장 열차화재 ── */
  m4bc:{doc:MAN+" · 4 승강장 열차화재 · 안내방송", text:"〔경보음 2~3초 울림〕열차 화재발생(3회 반복)\n우리역 ○○방면 승강장에서 열차화재가 발생하였습니다. 승객 여러분께서는 직원 안내에 따라 신속히 대피해 주시기 바라며 주변에 교통약자가 계시면 도움을 주시기 바랍니다. 발화지점 승객께서는 직원과 함께 주변 소화기로 초동진화에 협조하여 주시기 바랍니다."},
  m4:{doc:MAN+" · 4 승강장 열차화재 · 초동조치", text:"소화기, 소화전 사용 초기진화\n ※ 소화전 이용 시 선로단전 여부 확인\n - 배터리 화재는 초기진화 불가한 경우 진화생략, 초기진화 가능한 경우 냉각조치\n응급구호 및 대피유도\n ※ 터널 대피가 필요한 경우 관제 승인(지시) 요청 후 대피 유도(승강장안전문 개방) 및 인접역 통보"},
  m4end:{doc:MAN+" · 4 승강장 열차화재 · 영업재개 안내방송", text:"“우리역 ○○방면 승강장 열차화재는 조치완료되어 ○○시 ○○분부터 열차가 정상 운행될 예정입니다.”"},

  /* ── 6 사상사고 ── */
  m6:{doc:MAN+" · 6 사상사고 · 사고전개/초동조치", text:"H+5분(황금시간)\n상황보고/전파 : 관제센터 보고, 119·112 신고(초기대응팀 가동), 안내방송(열차운행 지연 등 필요시)\n초동조치 : 구호용품 휴대 - 구호장비(들것, 구급약품 등) 휴대\n사상자 상태 확인 및 응급조치\n [부상 시] 부상자 응급구호 및 후송조치 ※ 필요시 승객도움 요청, 2차사고 예방 조치, 목격자 확보 노력\n [사망 시] 2차사고 예방 조치, 목격자 확보 노력, 안내방송 실시, 119·112 도착 시 현장 안내\n승객안내 : 사상자 주변 통제 등\n[H+5분~H+30분] 이용안내 : 안내방송, 운임 반환(열차운행 지연 등 사유 발생시)\n승객안내 : 사상자 주변 통제 등\n현장조치 : 119 사상자 신병인계 및 보호자 연락, 목격자 진술서 확보, 영상자료 확보 노력(DVR 녹화 확인) ※ 승인 없이 외부 유출금지\n[H+2시간 이후] 상황보고"},
  m6p:{doc:MAN+" · 6 사상사고 · 개인별 조치임무", text:"[황금시간 H+5분]\n직원1 : 관제센터 보고, 119·112 신고(초기대응팀 가동), 안내방송(열차운행 지연 등 필요시)\n직원2 이상 : 구호용품 휴대 - 구호장비(들것, 구급약품 등) 휴대, 사상자 상태 확인 및 응급구호 조치, 2차사고 예방 조치, 목격자 확보 노력, 119·112 도착 시 현장 안내, 승객안내 - 사상자 주변 통제 등\n[H+30분 이내] 직원1 : 안내방송(열차운행 지연 등 필요시)\n직원2 이상 : 승객안내(사상자 주변 통제 등), 119 사상자 신병인계(의료기관 후송) 및 보호자 연락(인계), 목격자 진술서 확보 노력, 영상자료 확보 노력(DVR 녹화 확인) ※ 승인 없이 외부 유출금지\n[30분 이후·상황종료] 직원1 : 피해상황 등 상황보고"},
  m6bc:{doc:MAN+" · 6 사상사고 · 안내방송", text:"〔경보음 2~3초 울림〕사상사고 발생(3회 반복)\n○○역 승객 (사상)사고가 발생하여 ○○방면 열차가 지연되고 있사오니 잠시만 기다려 주시기 바랍니다. 이용에 불편을 드려 대단히 죄송합니다."},
  m6bc2:{doc:MAN+" · 6 사상사고 · 이용안내 방송", text:"“○○역에서 사상사고가 발생하여 ○○방면 열차가 지연되고 있습니다. 바쁘신 승객께서는 운임을 반환받으시고 타 교통편을 이용하시기 바랍니다. 이용에 불편을 드려 대단히 죄송합니다.”"},

  /* ── 9 역사 내 혼잡으로 인한 역사 출입구 통제 및 폐쇄(일부) ── */
  m9p:{doc:MAN+" · 9 역사 내 혼잡으로 인한 역사 출입구 통제 및 폐쇄(일부) · 개인별 조치임무", text:"[황금시간 H+5분]\n직원1 : 역사 내 혼잡상황 파악(CCTV, 순회), 관제센터 보고(초기대응팀 가동), 119·112 등 신고 및 지원요청 - 영업사업소·영업본부, 인접·환승역 등 통보·지원요청, 안전인력 배치(대합실, 게이트, 출입구 등), 무정차 통과·출입구통제 및 일부폐쇄 검토, 안내방송 실시(지속), (필요시) 게이트 비상모드 전환\n ※ 4인 이상 근무 시에는 「영업사업소·영업본부, 인접·환승역 통보 및 게이트 비상모드 전환」 임무를 직원4가 수행 → 이후 직원4는 구호 및 대피유도\n직원2 이상 : 현장출동, 혼잡상황 파악 및 보고 - 장비(무전기, 경광봉, 확성기, 승강장안전문 키 등) 휴대\n사복요원·자회사직원 : 승객 분산 및 통제, 대피유도 - 동선 분리(통제선, 안전펜스) / 교통약자 피난 보조 등\n[H+30분 이내] 직원1 : 관제 무정차 통과 요청, 경찰 협의 하 출입구 통제·일부폐쇄 시행(시행 후 관제센터 통보), 안내방송 실시(지속) - 무정차 통과, 출입구 통제·일부폐쇄 상황 안내\n직원2 이상 : 승객 분산 및 통제, 대피유도(지속) - 통제에 따른 대체 출구 안내 등, 현장 상황 수시 파악 및 보고\n[H+2시간 이내] 직원1 : 현장 상황 수시 파악 및 보고, 무정차 통과 및 출입구 통제상황 안내방송 지속, 무정차 통과 해제 및 출입구 개방 검토\n직원2 이상 : 승객 분산 및 통제, 대피유도(지속), 현장 상황 수시 파악 및 보고, 출입구 정상통제여부 수시확인\n[H+2시간~상황종료] 직원1 : 열차운행 재개 요청(관제 승인), 출입구개방(경찰 협의 후 시행), 안내방송 실시 - 열차운행 재개 및 출입구개방상황 안내방송, 영업재개 관련 인접 역 연동 및 환승역 통보\n직원2 이상 : 열차 운행 재개 및 출입구 개방 승객 안내, 영업재개 준비 및 재개 - 운임반환 및 승객안내\n직원1 : 피해상황 등 상황보고"},

  /* ── 12 승강장안전문 장애 ── */
  m12:{doc:MAN+" · 12 승강장안전문 장애 · 사고전개/초동조치", text:"상황파악 : CCTV 확인, 역사순회, 신고접수 등\n보고(신고) : 관제센터 및 PSD관리소 신고, 안내방송(필요 시)\n초동조치 : 현장출동 - 마스터키, 무전기 등 통신장비 휴대\n ※ 현장출동 후 관제센터에 상황통보, 관제센터 지시에 의거 조치\nPSD 전체 또는 일부 열림·닫힘 불능에 따른 초동조치 실시\n기술직원(PSD관리소 직원) 도착 전까지 안전요원 배치\n[H+5분 이후] 현장조치 : 기술직원 도착 전까지 안전요원 배치(지속), 승하차 질서 안내방송\n기술직원 도착 : 고객안전실/아이센터 방문 통보(2인1조), 승강장안전문 작업내용 입력, 기술직원 장애 조치\n이용안내 : 안내방송(필요시)\n상황종료 : 상황보고"},
  m12p:{doc:MAN+" · 12 승강장안전문 장애 · 개인별 조치임무", text:"[황금시간 H+5분]\n직원1 : 관제센터 및 PSD관리소 신고, CCTV 감시 및 안내방송\n직원2 이상·사복요원 : 고객안전실(아이센터) PSD종합제어반 장애내용 확인, 현장출동(마스터 키, 무전기 휴대)\n * 현장출동 후 관제센터에 통보하고 관제지시에 따라 조치\n▪PSD 일부열림 불능 시 : (승강장조작반)“전체 열림”버튼 취급 → 열림불능 시 인접도어 승객 승/하차 유도 → 출발전호 → (개별제어반)“전원스위치 On/Off(리셋)”조치 → 조치 불능 시 개별제어반 수동(단락) 설정 → 장애개소 열림상태 유지 및 출발전호, 안전요원 배치\n▪PSD 일부닫힘 불능 시 : (승강장조작반)“전체 닫힘”버튼 취급 → 닫힘불능 시 관제 승인 후 바이패스(인터록 무시) 취급 → 출발전호 → (개별제어반)“전원스위치 On/Off(리셋)”조치 → 조치 불능 시 출발전호, 안전요원 배치\n▪PSD 전체열림 불능 시 : (승강장조작반)“전체 열림”버튼 취급 → 열림불능 시 (개별도어)“수동 열림”조치 → 관제 승인 후 바이패스(인터록 무시) 취급 → 장애개소 열림상태 유지 및 출발전호, 안전요원 배치\n▪PSD 전체닫힘 불능 시 : (승강장조작반)“전체 닫힘”버튼 취급 → 닫힘 불능 시 관제 승인 후 바이패스(인터록 무시) 취급 → 출발전호, 안전요원 배치\n▪PSD 메인전원 차단 시 전체PSD 수동 열림상태 유지 - 기술직원(PSD관리소 직원) 도착 전까지 안전요원 배치\n[H+5분 이후] 기술직원 : 기술직원 장애 조치(2인1조) / 직원2 이상·사복요원 : 안내방송 및 운임반환(안내) ※ 안전요원배치는 상황에 따라 탄력적 적용\n[상황종료] 직원1 : 피해상황 등 상황보고"},
  m12bc:{doc:MAN+" · 12 승강장안전문 장애 · 안내방송", text:"〔경보음 2~3초 울림〕승강장안전문 장애(3회 반복)\n우리역 상/하선 승강장 전체/○-○지점 승강장안전문 장애가 발생하여 정상적으로 작동되고 있지 않으니 직원의 안내에 따라 승하차해 주시기 바랍니다. 이용에 불편을 끼쳐드려 죄송합니다."},

  /* ── 13 E/L 갇힘 ── */
  m13:{doc:MAN+" · 13 E/L 갇힘 사고 · 사고전개/초동조치", text:"H+0분 상황발생 : 신고 접수, E/L 상황 파악(판단) - E/L 위치확인, 승객 부상 등 확인\n상황보고(신고) : 관제센터 보고(초기대응팀 가동), 승강기사업소(유지보수업체) 신고, (승강기안전관리자 부재 등 필요시) 119 신고\n[황금시간 H+5분] 현장출동 및 초동조치 : 인터폰 이용 승객안심 조치\n - 승강기안전관리자 근무 시 : 〔이 E/L는 외부와 공기가 통하고, 추락위험 없으며, 전원스위치를 취급하면 ○○초간 소등된 후 재점등되니 안심하십시오〕설명 후 전원스위치 취급\n - 승강기안전관리자 부재 시 : 〔이 E/L는 외부와 공기가 통하고, 추락위험이 없으니 안심하십시오〕\nE/L 전원 리셋(승강기안전관리자만 취급)\n구출 완료 시 : 아래 임무 생략(E/L 고장안내문 부착, 상황보고)\n구출 실패 시 : 아래 임무 수행\n[H+30분 이내] 승객안정유도 : 승강기사업소(유지보수업체)직원 및 119대원 도착 시까지 인터폰 이용 승객안심 조치 〔조금만 기다리시면 소방관 및 유지보수업체에서 안전하게 구조해 드리오니 안심하십시오〕\n현장안내 : 승강기사업소(유지보수업체)직원 및 119대원 도착 시 현장안내, (필요시) 안내문 부착, 안내방송\n구조 조치 : 119에서 승객구출 시 - 승강기사업소(유지보수업체)직원 도착 전까지 분전함 Off(현장취급) / 승강기사업소(유지보수업체)에서 승객구출 시 - 119에 승객구출 완료 통보\n부상자 발생 시 응급구호, 사고원인 확인 후 가동(승강기사업소 직원), 상황보고\n[상황종료] 승강기사업소 통보 → 기술직원 현장 확인 → 중대사고(고장) 여부 결정, 중대사고(고장) 시 한국승강기안전공단 보고"},
  m13p:{doc:MAN+" · 13 E/L 갇힘 사고 · 개인별 조치임무", text:"[황금시간 H+5분]\n직원2 : 관제센터 보고, 승강기사업소(유지보수업체) 신고, (승강기안전관리자 부재 등 필요시) 119 신고\n직원1(승강기안전관리자) : E/L 위치 확인 및 현장출동, 인터폰 이용 승객안심 조치\n직원3 이상 : E/L 전원 리셋(승강기안전관리자만 취급)\n직원1(승강기안전관리자) : 구출 완료 시 - E/L 고장 안내문 부착, 안내방송 실시, 상황보고 / 구출 실패 시 - 아래 임무 수행\n직원2 이상 : 고장 E/L 사용불가 안내문 부착 - E/S 및 계단이용 안내\n[H+30분 이내] 직원1 : 승강기사업소(유지보수업체)·119구조대 현장 안내, 안내방송, 인터폰 이용 승객안심 조치\n직원2 이상 : 고장 E/L 사용불가 안내문 부착·안내방송 실시, 119에서 승객구출 시 - 승강기사업소직원 도착 전까지 분전함 Off(현장취급), 승강기사업소에서 승객구출 시 - 119에 승객구출 완료 통보, 부상자 발생 시 응급구호, 사고원인 확인 후 가동(승강기사업소 직원), 상황보고\n[상황종료] 직원1 : 승강기사업소 통보 → 기술직원 현장 확인 → 중대사고(고장) 여부 결정, 중대사고(고장) 시 한국승강기안전공단 보고"},

  /* ── 15 대규모 정전 ── */
  m15:{doc:MAN+" · 15 대규모 정전(Black Out) 발생 · 사고전개/초동조치", text:"H+5분(황금시간)\n상황수보(보고)/전파 : 관제센터 수보 또는 보고(초기대응팀 가동), 상황전파 및 안내방송 - 승객유도 안내방송(반복, 마이크 사용 안 될 시 메가폰 사용), 필요시 119·112 신고 ※ 환자발생 및 질서유지 필요시\n초동조치 : 장비휴대 출동(상황파악) - 승강장(랜턴, 휴대전화, 무전기, 승강장안전문 키 등 휴대) 출동, 승강장안전문 개방(필요 시)\n대피유도 및 응급구조 : 대피 유도 및 응급구호 - 교통약자 피난 보조 등\n[H+30분 이내] 안내방송(관제센터 방송 전까지 지속), 대피 유도 및 응급구호(지속), E/S 이용승객 등 부상여부 확인 ※ 사상사고 발생시 SOP에 따라 조치, E/L 승객 갇힘 유무 확인 및 구조 ※ E/L 갇힘 발생 시 SOP에 따라 조치, 터널 내 열차 정차\n119현장안내 : 119 도착 시 현장 위치 안내\n[H+1시간 이내] 조치여부 확인 : 급전 조치여부 확인, 관련부서와 영업재개 협의\n영업재개 준비 : 시설물 점검, 정상작동 여부 및 피해상황 확인, 역사 환경정비, 영업재개 준비 및 안내방송\n[H+2시간·상황종료] 피해상황 등 상황 보고"},
  m15p:{doc:MAN+" · 15 대규모 정전 · 개인별 조치임무", text:"[황금시간 H+5분]\n직원1 : 관제센터 수보 또는 보고(초기대응팀 가동), 상황전파 및 안내방송, 119·112 신고(필요 시)\n직원2,3 : 현장출동 - 승강장(랜턴, 휴대전화, 무전기, 필요시 승강장안전문 키 등 휴대) 출동, 승강장안전문 개방(필요 시)\n직원4 이상·사복요원·자회사 직원 : 대피 유도 및 응급구호 - 교통약자 피난 보조 등 ※ 필요시 119 등 신고\n[H+30분 이내] 직원1 : 안내방송(관제센터 방송 전까지 지속), 119 도착 시 현장 위치 안내\n직원2 이상 : 대피 유도 및 응급구호(지속), E/S 이용승객 부상여부 확인(필요 시 119신고), E/L 승객 갇힘 유무 확인 및 구조 ※ E/L 갇힘 발생 시 SOP에 따라 조치, 비상사다리 설치(열차 터널 및 승강장 정차 시)\n[H+1시간 이내] 직원1 : 안내방송, 관련부서와 영업재개 협의\n직원2 이상 : 시설물 점검, 정상작동 여부 및 피해상황 확인, 역사 환경정비(사회복무요원, 자회사 직원 등), 영업재개 준비 및 안내방송\n[H+2시간·상황종료] 직원1 : 상황보고"},
  m15bc:{doc:MAN+" · 15 대규모 정전 · 안내방송", text:"승객유도 안내방송(반복, 마이크 사용 안 될 시 메가폰 사용)\n“지금 우리 역에 정전이 발생하였으니 승객께서는 직원의 안내에 따라 대피하시고 주변에 교통약자가 계시면 도움을 주시기 바랍니다.”"},
  m15end:{doc:MAN+" · 15 대규모 정전 · 영업재개 안내방송", text:"“우리역에서 발생한 정전에 대한 조치완료되어 ○○시 ○○분부터 열차가 정상 운행될 예정입니다.”"},

  /* ── 16 역사 침수 ── */
  m16:{doc:MAN+" · 16 역사 침수 · 사고전개/초동조치", text:"[사전대응] 기상상황파악 : 기상예보 및 강수량 파악, 관계자 상황전파 및 공유, 취약개소 순찰 강화(역사 내부 배수로 및 외부 빗물받이 점검), (필요시) 우수유입 우려개소 초기대응 강화 - 차수판 설치, 모래주머니 쌓기, 지면환기구 우수유입 방지(지면환기구 천막 설치, 기계식 차수문 폐쇄), 차수문 50% 폐쇄\n[H+5분 황금시간] 상황보고/전파 : 관제센터 보고(초기대응팀 가동), 안내방송, 인접역(환승역) 연동, 119·112 등 지원 요청(필요 시)\n초동조치 : 현장출동 - 노면수 유입개소(출입구, E/L 등) 차수판 설치 ※ 연결통로 차수문(차수판) 설치여부 확인 ※ (필요 시) 지면환기구 천막 설치 및 환기설비 가동 중지 확인\n대피 유도 후 역사 진입 통제 - 교통약자 피난 보조 등, 부상자 발생 시 응급구호\n[H+30분 이내] 안내방송, 인근역 지원·열차운행 중지 요청(필요 시)\n현장조치 : 차수판 외측(인도 쪽) 모래 1단 쌓기, 역사 유입수 처리, (필요 시) 추가 조치 - 출입구 하단 모래포·차수벽 등 이중 물막이벽 설치, 차수판 추가 설치, 차수문 100% 폐쇄, 승강설비·AFC기기 전원차단(필요 시)\n대피 유도 및 응급구호 : 승객 대피, 역사진입 통제, 부상자 발생 시 응급구호\n현장안내 : 119 등 유관기관 도착시 현장안내"},
  m16p:{doc:MAN+" · 16 역사 침수 · 개인별 조치임무", text:"[황금시간 H+5분]\n직원1 : 관제센터 보고 및 119 지원 요청(필요 시), 안내방송, 초기대응팀 가동, 인접역(환승역) 연동\n직원2,3 : 현장출동 - 노면수 유입개소(출입구, E/L 등) 차수판 설치 ※ 연결통로 차수문(차수판) 설치여부 확인 ※ (필요 시) 지면환기구 천막 설치 및 환기설비 가동 중지 확인 ※ 차수노력 우선 실시 및 대피유도 병행\n직원4 이상·사복요원·자회사 직원·민간상주업체 : 대피 유도 후 역사 진입 통제 - 교통약자 피난 보조 등, 부상자 발생 시 응급구호\n[H+30분 이내] 직원1 : 안내방송, 인근역 지원·열차운행 중지 요청(필요 시), 119 등 유관기관 도착시 현장안내\n직원2,3 : 차수판 외측(인도 쪽) 모래 1단 쌓기, 역사 유입수 처리, (필요 시) 추가 조치 - 출입구 하단 모래포·차수벽 등 이중 물막이벽 설치, 차수판 추가 설치, 차수문 100% 폐쇄, 승강설비·AFC기기 전원차단(필요 시)\n직원4 이상 : 승객 대피, 역사진입 통제, 부상자 발생 시 응급구호\n[H+1시간 이내] 직원1 : 안내방송, 기상상황 및 노면수 현황 파악(지속), 관련부서와 영업재개 및 현장보존 여부 협의, 관제센터 유선보고\n직원2 이상 : 노면수 유입개소 및 취약개소 순찰 - 배수구 통수 상태 확인(이물질 수시 확인 및 제거), 도로변 배수구 통수 작업(관계기관 협조), 역사유입수 처리, 필요시 중요비품(지폐, 물품 등) 반출, 역사 출입금지 안내문 게시, 역사 진입통제(지속)"},
  m16bc:{doc:MAN+" · 16 역사 침수 · 안내방송", text:"〔경보음 2~3초 울림〕빗물 유입(3회 반복)\n우리역 ○○지점이 폭우로 침수되어 빗물이 유입(열차운행 중지)되고 있으니, 승객께서는 역사 밖으로 나가시어 다른 교통편을 이용하여 주시고 주변에 교통약자가 계시면 도움을 주시기 바랍니다."},
  m16bc2:{doc:MAN+" · 16 역사 침수 · 안내방송(H+30분)", text:"“폭우로 우리 역 ○○지점에 빗물이 유입되고 있으니 승객께서는 ○번 출입구로 나가시어 다른 교통편을 이용하여 주시기 바라며 주변에 교통약자가 계시면 도움을 주시기 바랍니다.”"},

  /* ── 17 지진 ── */
  m17:{doc:MAN+" · 17 지진 발생 · 사고전개/초동조치", text:"[H+5분 황금시간] 상황수보 : 관제센터에서 상황 수보(초기대응팀 가동)\n안내방송·상황전파, 119·112 신고(필요 시), 게이트 비상모드 전환(필요 시)\n초기대응 : 장비휴대 현장출동 - 공기호흡기(방독면), 랜턴, 통신장비(휴대전화, 무전기 등), 승강장안전문 키 휴대 출동(필요 시) ※ 화재·정전 발생 시 상황별 SOP에 따라 조치\n대피 유도, 응급구호 - 교통약자 피난 보조 등\n[H+30분 이내] 안내방송 실시, 승객 응급구호 및 대피 유도(지속), E/L 승객 갇힘 유무 확인 ※ E/L 갇힘 발생 시 SOP에 따라 조치, 119·112 도착 시 현장 위치 안내\n[H+1시간 이내] 상황종료 확인 : 관련부서와 영업재개 및 현장보존 여부 협의\n영업재개 준비 : 시설물 점검, 정상작동 여부 및 피해상황 확인, 역사 환경정비(역사 청소 및 소독), 영업재개 안내방송, 영업재개 관련 인접 역 연동, 운임반환 및 안내\n[H+2시간·상황종료] 피해상황 등 상황 보고"},
  m17p:{doc:MAN+" · 17 지진 발생 · 개인별 조치임무", text:"[황금시간 H+5분]\n직원1 : 초기대응팀 가동, 상황전파 및 안내방송 - 119·112 신고(필요 시), 승객유도 안내방송(반복), 게이트 비상모드 전환(필요 시)\n직원2,3 : 장비휴대 현장출동 - 공기호흡기(방독면), 랜턴, 통신장비(휴대전화, 무전기 등), 승강장안전문 키 휴대 출동(필요 시) ※ 화재·정전 발생 시 상황별 SOP에 따라 조치, 상황에 따라 대피유도\n직원4 이상·사복요원·자회사 직원 : 대피 유도 및 응급구호 - 교통약자 피난 보조 등\n[H+30분 이내] 직원1 : 안내방송(필요시 메가폰 사용), 119·112 도착 시 현장 안내\n직원2,3 : E/L 승객 갇힘 시 - E/L 갇힘 발생 시 SOP에 따라 조치, 비상인터폰 통화(지속적인 대화실시로 승객 안정 유도, 관제센터 보고, 기술사업소 및 119 신고), 상황에 따라 대피유도, 비상사다리 설치(터널 열차 정지 등 필요 시)\n직원4 이상·사복요원·자회사 직원 : 대피 유도 및 응급구호(지속)\n[H+1시간 이내] 직원1 : 영업재개 안내방송, 관련부서와 영업재개 협의\n직원2 이상 : 시설물 점검, 정상작동 여부 및 피해상황 확인, 역사 환경정비(사회복무요원, 자회사 직원 등), 영업재개 관련 인접 역 연동 및 환승역 통보, 운임반환 및 안내\n[H+2시간·상황종료] 직원1 : 피해상황 등 상황 보고"},
  m17bc:{doc:MAN+" · 17 지진 발생 · 안내방송", text:"〔경보음 2~3초 울림〕지진발생(3회 반복)\n지금 우리역에 지진이 발생하였으니 승객께서는 직원 안내에 따라 대피하시고 주변에 교통약자가 계시면 도움을 주시기 바랍니다."},
  m17end:{doc:MAN+" · 17 지진 발생 · 영업재개 안내방송", text:"“지진상황이 종료되어 ○○시 ○○분부터 열차가 정상 운행될 예정입니다.”"},

  /* ── 18 열차 운행 중 승객 비상핸들(코크) 취급 시 ── */
  m18:{doc:MAN+" · 18 열차 운행 중 승객 비상핸들(코크) 취급 시(공통) · 사고전개/초동조치", text:"H+0분 상황발생\n[H+5분 황금시간] 상황수보(보고)/전파 : 관제센터 수보(보고), 119 신고(초기대응팀 가동), 안내방송, 인접역 및 환승역 통보, 게이트 비상모드 전환(필요 시)\n장비 휴대 : 무전기 등 통신장비, 승강장안전문 키, 구호장비(랜턴 등) 휴대"},

function applyPreset(){
  let n = 0;

/** 단계의 어떤 값이 함수면 현재 상황으로 계산해 준다 */
function val(v, f, i){ return typeof v === "function" ? v(f || (S.run && S.run.flags) || {}, i || (S.run && S.run.info) || {}) : v; }

function cfgOf(scn){ return INFO_CFG[scn] || {places:["기타"], train:() => false, car:false}; }

function roleDesc(scn, r, n){

  const base = t[r] || "";

const KEY = "sop.v1";

/** 저장된 내용에서 S.run 이 S.runs 안의 같은 객체를 가리키게 맞춘다 */
function syncRuns(){
  if (!S.runs) S.runs = [];
  if (S.run && !S.runs.includes(S.run)){
    const i = S.runs.findIndex(r => r.start === S.run.start && r.scn === S.run.scn);
    if (i >= 0) S.runs[i] = S.run; else S.runs.push(S.run);
  }
  if (!S.run && S.runs.length) S.run = S.runs.find(r => !r.finished) || S.runs[S.runs.length-1];
}
function load(){
  try{ const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v) S = Object.assign(S, v); }catch(e){}
  syncRuns();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/** 역번호 (수도권 전철 체계). 지선 역은 번호가 달라 제외 */
function stnoOf(name, line){ return (STNO[line] || {})[name] || null; }
/**
 * 역번호와 다른 내선번호를 쓰는 역
 *  하남선(강일~하남검단산)은 하남시·하남도시공사 구간이라 561~565 블록을 쓴다.
 *  ok:true 는 실제 번호를 확인한 역, false 는 블록 규칙으로 미루어 본 번호.
 */
const EXT_FIX = {
  "5호선": {
    "강일":        {ext:"5611", ok:true,  memo:"확인된 번호"},
    "미사":        {ext:"5620", ok:true,  memo:"114 등재 번호"},
    "하남풍산":    {ext:"5631", ok:false, memo:"563 블록 추정"},
    "하남시청":    {ext:"5641", ok:false, memo:"564 블록 추정"},
    "하남검단산":  {ext:"5651", ok:true,  memo:"114 등재 번호"}
  }
};
/** 8호선 별내 연장은 남양주·구리 구간이라 번호 체계가 다를 수 있다 */
const EXT_DOUBT = {"8호선": ["별내","다산","동구릉","구리","장자호수공원"]};

function extInfo(name, line){
  const fix = (EXT_FIX[line] || {})[name];
  if (fix) return fix;
  const no = stnoOf(name, line);
  if (!no) return null;
  const ext = String(no) + (parseInt(line) <= 4 ? "1" : "2");
  const doubt = (EXT_DOUBT[line] || []).includes(name);
  return {ext, ok: !doubt, memo: doubt ? "연장구간 — 확인 필요" : ""};
}
/** 역 내선번호 : 1~4호선은 역번호 뒤에 1, 5~8호선은 뒤에 2 */
function extOf(name, line){ const i = extInfo(name, line); return i ? i.ext : null; }
/** 호선별 국번 : 1~4호선 02-6110, 5~8호선 02-6311 */
function prefixOf(line){
  if (S.prefix) return S.prefix.replace(/[^0-9+]/g, "");   // 직접 넣은 값이 있으면 그것
  const n = parseInt(line);
  return n >= 1 && n <= 4 ? "026110" : "026311";
}
/** 내선번호를 실제로 걸 수 있는 번호로 */
function dialOf(ext, line){
  const p = prefixOf(line);
  return p ? p + ext : null;
}
const ALL_STATIONS = [...new Set(Object.values(LINES).flat().flat())].sort((a,b)=>a.localeCompare(b,"ko"));
function normStation(v){ return (v||"").trim().replace(/역$/,""); }
function linesOf(st){ return Object.keys(LINES).filter(l => LINES[l].some(p => p.includes(st))); }
function neighbors(st){
  const out = [];
  for (const line of Object.keys(LINES)){
    const set = new Set();
    for (const p of LINES[line]){
      p.forEach((s,i) => { if (s === st){ if (p[i-1]) set.add(p[i-1]); if (p[i+1]) set.add(p[i+1]); } });
    }
    set.delete(st);
    set.forEach(n => out.push({name:n, line, type:"인접역"}));
  }
  return out;
}
function notifyTargets(){
  const st = S.station; if (!st) return [];
  const ls = linesOf(st);
  const t = neighbors(st);
  if (ls.length > 1) ls.forEach(l => t.unshift({name:st, line:l, type:"환승"}));
  return t;
}
const pkey = t => t.name + "@" + t.line;

/* 직급순 자동 배정 : 부역장 → 차장 → 과장 → 대리 → 사원 */
function assign(crew){
  return crew.map((p,i)=>({...p, i})).sort((a,b) => (RANKS.indexOf(a.rank)-RANKS.indexOf(b.rank)) || (a.i-b.i))
             .map((p,k)=>({...p, role:k+1}));
}

        <button class="trainSw" id="trainSw" aria-pressed="${!!S.train}">
          <span class="sw"></span>
          <span><b>훈련 모드</b><small>${S.train ? "방송·무전 문구 앞에 「훈련 상황입니다」가 붙고, 기록과 상황보고에 훈련으로 표시됩니다" : "불시훈련 때 켜세요. 실제 상황이면 꺼 두세요"}</small></span>
        </button>
      </section>
      <div class="bar"><div class="in">
        <button class="btn ${S.train ? "okb" : "fire"}" id="startBtn">▶ ${adding ? "추가 상황 시작" : (S.train ? "훈련 시작" : "임무 시작")} <small>스톱워치 시작</small></button>
      </div></div>`;
    $("#back").onclick = renderHome;
    app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { pick.n = +b.dataset.n; if (pick.r > pick.n) pick.r = 1; draw(); });
    app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { pick.r = +b.dataset.r; draw(); });
    $("#crewBtn").onclick = () => openCrew(() => renderRole(scn));
    $("#trainSw").onclick = () => { S.train = !S.train; save(); draw(); };
    $("#startBtn").onclick = startRun;
  }
}

/* ════════════════════════════════════════
   화면 3 · 진행
   ════════════════════════════════════════ */
/* ════════════════════════════════════════
   여러 상황을 함께 진행
     S.runs  : 진행 중인 상황들 (화재, 혼잡 …)
     S.run   : 지금 보고 있는 상황 (S.runs 안의 하나를 가리킨다)
   ════════════════════════════════════════ */
function allRuns(){ return (S.runs && S.runs.length) ? S.runs : (S.run ? [S.run] : []); }
function liveRuns(){ return allRuns().filter(r => !r.finished); }
/** 지금 보고 있는 상황을 바꾼다 */
function switchRun(i){
  if (!S.runs || !S.runs[i]) return;
  S.run = S.runs[i]; save(); renderRun(true);
}
function startRun(){
  S.last = {n:pick.n, r:pick.r};
  const run = {scn:pick.scn, n:pick.n, r:pick.r, train:!!S.train, start:Date.now(), cur:null, done:{}, flags:{}, info:{place:"", placeEtc:"", kind:"", dir:"", car:"", exit:"", closeExit:""}, ticks:{}, finished:null};
  S.runs = S.runs || [];
  // 끝난 상황만 남아 있으면 새로 시작하는 것으로 본다
  if (!liveRuns().length) S.runs = [];
  S.runs.push(run);
  S.run = run;
  const st = visibleSteps(); S.run.cur = st[0].id;
  save(); renderRun(true);
}
function allSteps(){
  const {scn, n, r} = S.run;
  const F = {fire:fireSteps, battery:batterySteps, crash:crashSteps, tunnel:tunnelSteps,
             casualty:casualtySteps, crowd:crowdSteps, psd:psdSteps, el:elSteps,
             blackout:blackoutSteps, flood:floodSteps, quake:quakeSteps,
             bomb:bombSteps, gas:gasSteps};
  return F[scn] ? F[scn](n, r) : [];
}
function visibleSteps(){ return allSteps().filter(s => !s.if || s.if(S.run.flags, S.run.info)); }
function elapsed(){ return ((S.run.finished || Date.now()) - S.run.start)/1000; }

function placeText(f){
  const p = f.place;
  if (!p) return null;
  if (p === "승강장" && S.run.scn === "crash") return "{방향} 승강장";
  if (p === "터널(본선)") return "{방향} 본선 터널";
  if (p === "열차(승강장)") return "{방향} 승강장 열차 {호차}";
  if (p === "열차(터널)") return "{방향} 터널 내 열차 {호차}";
  if (p === "기타") return f.placeEtc || null;
  return p;
}
function ctxFill(tpl){
  const run = S.run, f = run.info;
  tpl = tpl.split("{장소}").join(placeText(f) || "{장소}");
  const v = {
    "역": S.station ? S.station+"역" : null,
    "방향": f.dir || null,
    "호차": f.car ? f.car+"호차" : null,
    "출구": f.exit ? f.exit+"번 출구" : null,
    "폐쇄출구": f.closeExit ? f.closeExit+"번 출구" : null,
    "사고": f.kind ? ({"차량고장":"차량 고장"}[f.kind] || f.kind) : null
  };
  const blank = {"역":"○○역","방향":"○○","호차":"○호차","출구":"○번 출구","장소":"○○","폐쇄출구":"○번 출구","사고":"○○"};
  return esc(tpl).replace(/\{(역|방향|호차|출구|장소|폐쇄출구|사고)\}/g, (_,k) => v[k] ? `<span class="tok">${esc(v[k])}</span>` : `<span class="blank">${blank[k]}</span>`);
}

function phoneOf(kind){
  if (kind === "119") return "119";
  if (kind === "112") return "112";
  return S.phones[kind] || "";
}
function callHTML(kind){
  if (kind === "인접역"){
    const ts = notifyTargets();
    if (!S.station) return `<button class="call missing" data-act="settings"><span class="ph">📍</span><span class="who"><b>우리 역을 먼저 정해 주세요</b><span>인접역이 자동으로 표시됩니다</span></span></button>`;
    const one = t => {
      const label = t.type === "환승" ? `${t.line} ${t.name}역 (환승)` : `${t.line} ${t.name}역`;
      const saved = S.phones[pkey(t)];
      const ext = extOf(t.name, t.line);
      const num = saved || (ext ? (dialOf(ext, t.line) || ext) : null);
      const inf = extInfo(t.name, t.line);
      const sub = saved ? `${t.line} · ${saved}` : (ext ? `${t.line} · 내선 ${ext}${inf && !inf.ok ? " (확인 필요)" : ""}` : `${t.line} · 번호 입력`);
      return num
        ? `<a class="call" href="tel:${esc(String(num).replace(/[^0-9+]/g,""))}"><span class="ph">📞</span><span class="who"><b>${esc(label)}</b><span>${esc(sub)}</span></span></a>`
        : `<button class="call missing" data-act="settings"><span class="ph">＋</span><span class="who"><b>${esc(label)}</b><span>${esc(sub)}</span></span></button>`;
    };
    const tr = ts.filter(t => t.type === "환승"), ad = ts.filter(t => t.type !== "환승");
    return (tr.length ? `<div class="callgrp">환승역 ${tr.length}곳</div>` + tr.map(one).join("") : "")
         + (ad.length ? `<div class="callgrp">인접역 ${ad.length}곳</div>` + ad.map(one).join("") : "");
  }
  if (kind === "관제" && S.phones["관제상황"]){
    return [["관제","종합관제단(운전)"],["관제상황","종합관제단(상황)"]].filter(([k]) => S.phones[k]).map(([k,l]) =>
      `<a class="call" href="tel:${esc(S.phones[k].replace(/[^0-9+]/g,""))}"><span class="ph">📞</span><span class="who"><b>${l}</b><span>${esc(S.phones[k])}</span></span></a>`).join("");
  }
  const names = {"119":"119","112":"112"};
  CONTACTS.forEach(c => names[c.k] = c.label);
  const ph = phoneOf(kind);
  return ph
    ? `<a class="call" href="tel:${esc(ph.replace(/[^0-9+]/g,""))}"><span class="ph">📞</span><span class="who"><b>${names[kind]} 전화</b><span>${esc(ph)}</span></span></a>`
    : `<button class="call missing" data-act="settings"><span class="ph">＋</span><span class="who"><b>${names[kind]}</b><span>번호 입력</span></span></button>`;
}

/** 상단 「장소 설정」 칩에 쓸 글 */
function placeChipText(run){
  const f = run.info, cfg = cfgOf(run.scn);
  const bits = [];
  if (cfg.kinds && f.kind) bits.push(f.kind);
  if (f.place) bits.push(f.place === "기타" ? (f.placeEtc || "기타") : f.place);
  if (cfg.train(f.place) && f.dir) bits.push(f.dir);
  if (cfg.car && cfg.train(f.place) && f.car) bits.push(f.car + "호차");
  return bits.length ? bits.join(" · ") : "장소 설정";
}
function placeChipDone(run){ return !!run.info.place; }

function catChip(key){ const c = CATS[key]; return `<span class="cat" style="--c:${c.c}">${c.label}</span>`; }

let nudgeFor = null;
function renderRun(first){
  const run = S.run;
  const steps = visibleSteps();
  let idx = steps.findIndex(s => s.id === run.cur);
  if (idx < 0){
    /* 장소·결과를 바꿔서 지금 단계가 사라지면, 남은 임무 중 첫 번째로 */
    const nx = steps.find(s => !run.done[s.id]) || steps[steps.length-1];
    run.cur = nx.id; idx = steps.indexOf(nx); save();
  }
  const cur = steps[idx];
  if (run.stepAt !== cur.id){ run.stepAt = cur.id; run.stepFrom = Date.now(); save(); }
  const roleName = (() => { if (S.crew.length === run.n){ const p = assign(S.crew).find(x=>x.role===run.r); if (p) return `${p.name?p.name+" ":""}${p.rank}`; } return ""; })();
  const sc = SCENARIOS.find(s=>s.id===run.scn);
  const inf = run.info;

  let html = `
    <header class="runhead">
      <div class="r1">
        <button class="menu home" id="homeBtn2" aria-label="홈으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.2.9 10.6a1.1 1.1 0 0 0 .71 1.94H3.7v8.35a1.1 1.1 0 0 0 1.1 1.1h4.3v-6.3h5.8v6.3h4.3a1.1 1.1 0 0 0 1.1-1.1v-8.35h2.09a1.1 1.1 0 0 0 .71-1.94Z"/></svg></button>
        <div class="who"><b>${run.train ? `<span class="tbadge">훈련</span>` : ""}${scnIconSm(sc)}${SHORT[sc.id] || sc.name}</b><span><b style="font-size:15px;color:#fff">직원${run.r}</b> · ${run.n}명 근무${roleName?" · "+esc(roleName):""}${S.station?" · "+esc(S.station)+"역":""}</span></div>
        <div class="clock" id="clock"><div class="t num" id="clockT">00:00</div><div class="b" id="clockB"></div></div>
        <button class="menu" id="menuBtn" aria-label="메뉴">⋯</button>
      </div>
      ${(() => {
        const rs = allRuns();
        if (rs.length < 2) return "";
        return `<div class="tabs">${rs.map((x,i) => {
          const sc = SCENARIOS.find(y => y.id === x.scn);
          const on = x === run;
          return `<button class="tab${on ? " on" : ""}${x.finished ? " fin" : ""}" data-tab="${i}" style="--c:${sc.c}">
            ${x.finished ? "✓ " : ""}${esc(SHORT[sc.id] || sc.name)}</button>`;
        }).join("")}</div>`;
      })()}
      <div class="info">
        <button data-act="info" class="${placeChipDone(run) ? "" : "empty"}">📍 ${placeChipText(run)}</button>
        ${cfgOf(run.scn).closeExit ? `<button data-act="info" class="${inf.closeExit?"":"empty"}">${inf.closeExit ? "폐쇄 "+esc(inf.closeExit)+"번 출구" : "폐쇄 출구 ?"}</button>` : ""}
      </div>
    </header>
    <section class="track" id="track">`;

  let lastBand = -1;
  steps.forEach((s, i) => {
    if (s.band !== lastBand){
      lastBand = s.band;
      html += `<div class="band" data-band="${s.band}"><span class="pill">${BANDS[s.band].label}</span><span class="st num" data-bandst="${s.band}"></span></div>`;
    }
    const d = run.done[s.id];
    if (i === idx){
      html += `<div class="stop current" id="current"><div class="rail"><span class="dot"></span></div>${currentCard(cur, i, steps.length)}</div>`;
    } else if (!d && i < idx){
      html += `<div class="stop pend"><div class="rail"><span class="dot">!</span></div>
        <button class="card" data-go="${s.id}"><span class="tt">${esc(s.title)}</span><span class="pendtag">보류 · 눌러서 하기</span></button></div>`;
    } else if (d){
      html += `<div class="stop done"><div class="rail"><span class="dot">✓</span></div>
        <button class="card" data-go="${s.id}" aria-label="${esc(s.title)} 단계로 돌아가기">
          <span class="tt">${esc(s.title)}</span>${d&&d.choice?`<span class="chosen">${esc(d.choice)}</span>`:""}<span class="when num">${d?fmt(d.at):""}</span>
        </button></div>`;
    } else {
      const far = i > idx + 3;
      html += `<div class="stop up ${far?"far":""}"><div class="rail"><span class="dot"></span></div>
        <div class="card"><span class="tt">${esc(s.title)}</span>${far?"":catChip(s.cat)}</div></div>`;
    }
  });
  html += `</section>`;

  /* 하단 버튼 */
  let bar;
  if (cur.choice){
    bar = `<button class="btn ghost" data-act="prev" aria-label="이전 단계">◀</button>` +
      (cur.defer ? `<button class="btn ghost" data-act="defer" style="flex:1;font-size:17px">${esc(cur.defer)}</button>`
                 : `<span class="hint">위에서 결과를 고르세요</span>`);
  } else if (cur.optional){
    bar = `<button class="btn ghost" data-act="prev" aria-label="이전 단계">◀</button>
           <button class="btn ghost" data-act="skip" style="flex:1">${esc(cur.optional)}</button>
           <button class="btn go" data-act="ok" style="flex:1.3">✓ 완료</button>`;
  } else {
    bar = `<button class="btn ghost" data-act="prev" aria-label="이전 단계">◀</button>
           <button class="btn go" data-act="ok">✓ 완료 <small>다음 단계로</small></button>`;
  }
  const nx = steps.slice(idx+1).find(x => !run.done[x.id]);
  const pend = steps.filter((x,k) => k < idx && !run.done[x.id]);
  const pendBtn = pend.length ? `<button class="pendbtn" data-go="${pend[0].id}">보류 ${pend.length}</button>` : "";
  const peek = (cur.choice ? `<div class="peek"><span class="n">선택</span><b>고른 결과에 따라 다음 임무가 달라집니다</b>` : nx ? `<div class="peek"><span class="n">다음</span><b>${esc(nx.title)}</b>` : `<div class="peek"><span class="n">마지막</span><b>이 단계를 마치면 임무가 끝납니다</b>`) + pendBtn + `</div>`;
  html += `<div class="bar">${peek}<div class="in">${bar}</div></div>`;
  app.innerHTML = html;

  /* 연결 */
  $("#menuBtn").onclick = openMenu;
  $("#homeBtn2").onclick = goHome;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => switchRun(+b.dataset.tab));
  app.querySelectorAll("[data-act='info']").forEach(b => b.onclick = openInfo);
  app.querySelectorAll("[data-act='settings']").forEach(b => b.onclick = openSettings);
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { run.cur = b.dataset.go; nudgeFor = null; save(); renderRun(); });
  app.querySelectorAll("[data-check]").forEach(b => b.onclick = () => {
    const k = cur.id+"#"+b.dataset.check; run.ticks[k] = !run.ticks[k]; save();
    b.setAttribute("aria-pressed", !!run.ticks[k]); b.querySelector(".box").textContent = run.ticks[k] ? "✓" : "";
  });
  const sb = app.querySelector("[data-act='src']"); if (sb) sb.onclick = () => openSource(cur);
  app.querySelectorAll("[data-peek]").forEach(b => b.onclick = () => openPeek(b.dataset.peek));
  app.querySelectorAll("[data-vid]").forEach(b => b.onclick = () => playVideo(b.dataset.vid));
  const pv = app.querySelector("[data-act='prev']"); if (pv) pv.onclick = () => goPrev();
  const ok = app.querySelector("[data-act='ok']"); if (ok) ok.onclick = () => complete(cur);
  const sk = app.querySelector("[data-act='skip']"); if (sk) sk.onclick = () => complete(cur, cur.optional, true);
  const df = app.querySelector("[data-act='defer']"); if (df) df.onclick = () => deferStep(cur);
  app.querySelectorAll("[data-choice]").forEach(b => b.onclick = () => {
    const o = cur.choice[+b.dataset.choice];
    Object.assign(run.flags, o.set); complete(cur, o.label);
  });

  startTick(); screen = "run"; keepOn(true);
  requestAnimationFrame(() => {
    const el = $("#current"), head = document.querySelector(".runhead");
    if (!el) return;
    const top = window.scrollY + el.getBoundingClientRect().top - head.offsetHeight - 96;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({top: Math.max(0, top), behavior: (first || reduce) ? "auto" : "smooth"});
  });
}

/** 역 직원 전체는 실내 방송(마이크), 특정인에게 하는 보고는 무전 */
/** 훈련 모드면 말하기 문구 앞에 훈련 상황임을 붙인다 */
function trainPrefix(kind){
  if (!(S.run && S.run.train)) return "";
  if (/방송|마이크/.test(kind)) return "지금은 훈련 상황입니다. ";
  if (/무전|외치|전화|소방대원|구조대원|경찰|승객에게/.test(kind)) return "훈련 상황입니다. ";
  return "";
}
function speakKind(s){
  const k = (s.script && s.script.kind) || "";
  if (k.indexOf("무전") < 0) return k;
  const t = typeof s.script.text === "function" ? s.script.text({}) : (s.script.text || "");
  // 특정인에게 하는 보고·요청만 무전, 역 직원 전체는 실내 방송
  const toPerson = /부역장님|역장님|직원[①②③④1-4]/.test(t) || /^(선로 단전 확인되었습니다|소화전 사용)/.test(t);
  return toPerson ? k : "🎙 마이크에 말하세요 (실내방송)";
}
function currentCard(s, i, total){
  const run = S.run;
  const c = CATS[s.cat];
  let h = `<div class="card" style="--c:${c.c}">
    <div class="cur-top">${catChip(s.cat)}<span class="step num">${i+1} / ${total}단계</span></div>
    <div class="cur-title">${stepIcon(s.icon)}<h2 class="${s.title.length > 30 ? "long" : ""}">${esc(s.title)}</h2></div>`;
  const det = val(s.detail); if (det) h += `<p class="cur-detail">${esc(det)}</p>`;
  if (s.also) h += `<div class="also">＋ 같은 시각 기록 : ${esc(s.also)}</div>`;
  const imp = val(s.important); if (imp) h += `<div class="important">⚠ ${esc(imp)}</div>`;
  const tm = timerFor(s);
  if (tm) h += `<div class="steptimer" id="stepTimer" data-sec="${tm.sec}"><span class="n num">0:00</span><span class="g">／ ${fmt(tm.sec)}</span><span class="m">${esc(tm.note)}</span></div>`;
  if (s.verify) h += `<div class="verify">확인 필요 · ${esc(s.verify)}</div>`;
  if (s.choice) h += `<div class="choices">${s.choice.map((o,k)=>`<button class="ch ${o.kind}" data-choice="${k}"><b>${esc(o.label)}</b>${o.sub?`<span>${esc(o.sub)}</span>`:""}</button>`).join("")}</div>`;
  if (s.items && s.noCheck){
    h += `<ul class="plainlist">${s.items.map(it => `<li>${esc(it)}</li>`).join("")}</ul>`;
  } else if (s.items){
    h += `<ul class="checks">${s.items.map((it,k)=>{ const on = !!run.ticks[s.id+"#"+k];
      return `<li><button data-check="${k}" aria-pressed="${on}"><span class="box">${on?"✓":""}</span><span class="lbl">${esc(it)}</span></button></li>`; }).join("")}</ul>`;
  }
  if (s.calls) h += `<div class="calls">${s.calls.map(callHTML).join("")}</div>`;
  const scripts = s.scripts ? s.scripts : (s.script ? [s.script] : []);
  scripts.forEach(sc => {
    const t0 = typeof sc.text === "function" ? sc.text(run.flags) : sc.text;
    const kind = speakKind({script:sc});
    const t = trainPrefix(kind) + t0;
    h += `<div class="script${run.train ? " train" : ""}"><div class="kind">${esc(kind)}${run.train ? " · 훈련" : ""}</div><div class="txt">${ctxFill(t)}</div>`;
    if (sc.en) h += `<div class="en">${esc(sc.en)}</div>`;
    if (sc.draft) h += `<div class="draft">※ 원문에 문구가 없어 앱에서 작성한 예시입니다.</div>`;
    h += `</div>`;
  });
  const vids = videosFor(s);
  if (vids.length) h += `<div class="vids">${vids.map(v =>
    `<button class="vid" data-vid="${esc(v.k)}">▶ ${esc(v.name)}<span>영상</span></button>`).join("")}</div>`;
  if (s.links) h += `<div class="links">${s.links.map(k=>{ const x = SCENARIOS.find(y=>y.id===k); return `<button data-peek="${k}">${x.icon} ${x.name} SOP 보기</button>`; }).join("")}</div>`;
  if (nudgeFor === s.id) h += `<div class="nudge">체크하지 않은 항목이 있습니다. 한 번 더 누르면 넘어갑니다.</div>`;

  return h;
}

function complete(s, choiceLabel, skipped){
  const run = S.run;
  if (s.items && !s.noCheck && !choiceLabel){
    const left = s.items.filter((_,k)=>!run.ticks[s.id+"#"+k]).length;
    if (left && nudgeFor !== s.id){ nudgeFor = s.id; renderRun(); return; }
  }
  nudgeFor = null;
  run.done[s.id] = {at: elapsed(), wall: Date.now(), title: s.title, band: s.band,
                    rpt: s.rpt || "", choice: choiceLabel || "", skip: !!skipped};
  // 같은 시각에 함께 이뤄지는 일도 보고에 남긴다
  if (s.also && !skipped)
    run.done[s.id + "+"] = {at: elapsed(), wall: Date.now(), title: s.also, band: s.band, choice: "", also:true};
  const steps = visibleSteps();
  const i = steps.findIndex(x => x.id === s.id);
  const next = steps.slice(i+1).find(x => !run.done[x.id]) || steps.find(x => !run.done[x.id]);
  if (!next){
    run.finished = Date.now(); save();
    const rest = liveRuns();
    if (rest.length){            // 아직 진행 중인 다른 상황이 있다
      const done = SCENARIOS.find(x => x.id === run.scn);
      const nx = SCENARIOS.find(x => x.id === rest[0].scn);
      openSheet(`<h3>✓ ${esc(done.name)} 임무 완료</h3>
        <p style="margin:0 0 18px;font-size:17px;line-height:1.6">아직 <b>${esc(nx.name)}</b> 상황이 진행 중입니다.</p>
        <div style="display:flex;gap:10px">
          <button class="btn ghost" id="dnEnd" style="flex:1">전체 종료</button>
          <button class="btn go" id="dnNext" style="flex:1.4">${esc(nx.name)} 이어서</button>
        </div>`, null);
      $("#dnNext").onclick = () => { closeSheet(); S.run = rest[0]; save(); renderRun(true); };
      $("#dnEnd").onclick = () => { closeSheet(); liveRuns().forEach(r => r.finished = Date.now()); save(); renderDone(); };
      return;
    }
    renderDone(); return;
  }
  run.cur = next.id; save(); renderRun();
}
function deferStep(s){
  const steps = visibleSteps();
  const i = steps.findIndex(x => x.id === s.id);
  const next = steps.slice(i+1).find(x => !S.run.done[x.id]);
  if (!next){ toast("남은 다른 임무가 없습니다"); return; }
  S.run.cur = next.id; save(); renderRun(); toast("보류했습니다 · 아래 ‘보류’로 돌아올 수 있습니다");
}
function goPrev(){
  const steps = visibleSteps();
  const i = steps.findIndex(x => x.id === S.run.cur);
  if (i > 0){ S.run.cur = steps[i-1].id; nudgeFor = null; save(); renderRun(); }
  else toast("첫 단계입니다");
}

/* 스톱워치 */
let tickH = null;
function startTick(){ stopTick(); tick(); tickH = setInterval(tick, 250); }
function stopTick(){ if (tickH){ clearInterval(tickH); tickH = null; } }
function tick(){
  if (!S.run) return;
  const e = elapsed();
  const steps = visibleSteps();
  const cur = steps.find(s => s.id === S.run.cur) || steps[0];
  const lim = BANDS[cur.band].limit;
  const over = e > lim;
  const ck = $("#clock"); if (!ck) return;
  $("#clockT").textContent = fmt(e);
  $("#clockB").textContent = over ? `${BANDS[cur.band].short} +${fmt(e-lim)}` : `${BANDS[cur.band].short} ${fmt(lim-e)}`;
  ck.classList.toggle("over", over);
  const st = document.querySelector("#stepTimer");
  if (st){
    const lim = parseInt(st.dataset.sec || "0", 10);
    const d = (Date.now() - (S.run.stepFrom || Date.now())) / 1000;
    st.querySelector(".n").textContent = fmt(d);
    if (lim) st.classList.toggle("over", d > lim);
  }
  BANDS.forEach((b, k) => {
    const el = document.querySelector(`[data-bandst="${k}"]`); if (!el) return;
    const inBand = steps.filter(s => s.band === k);
    const left = inBand.filter(s => !S.run.done[s.id]).length;
    const row = el.parentElement;
    row.classList.remove("over","clear");
    if (!left){ row.classList.add("clear"); el.textContent = "완료"; }
    else if (e > b.limit){ row.classList.add("over"); el.textContent = `기한 초과 · 남은 임무 ${left}`; }
    else el.textContent = `남은 ${fmt(b.limit - e)} · 임무 ${left}`;
  });
}

/** 끝낸 임무를 보관함에 남긴다 (최근 20건) */
function archive(){
  const run = S.run; if (!run || !run.finished || run.saved) return;
  const multi = allRuns();
  const rows = Object.values(run.done).filter(r => !r.sys && !r.skip).sort((a,b) => a.at - b.at);
  const over = BANDS.map((b,k) => {
    const ds = rows.filter(r => r.band === k); if (!ds.length) return null;
    return Math.max(...ds.map(r => r.at)) <= b.limit;
  }).filter(x => x !== null);
  S.logs = S.logs || [];
  S.logs.unshift({
    at: Math.min(...multi.map(x => x.start)), end: Math.max(...multi.map(x => x.finished || Date.now())),
    scn: run.scn, more: multi.length > 1 ? multi.map(x => x.scn) : null, n: run.n, r: run.r,
    train: !!run.train, station: S.station, steps: rows.length,
    sec: (run.finished - run.start) / 1000,
    golden: over.length ? over[0] : null,
    report: reportText(),
    log: (() => {
      const keep = S.run;
      const txt = multi.map(x => { S.run = x; const sc = SCENARIOS.find(y => y.id === x.scn);
        return (multi.length > 1 ? `[${sc.name}]\n` : "") + myLog().split("\n").slice(1).join("\n"); }).join("\n\n");
      S.run = keep; return txt;
    })()
  });
  S.logs = S.logs.slice(0, 20);
  run.saved = true; save();
}

    <div class="log">${rows.map(r=>`<div><time class="num">${clockOf(r.wall)}</time><span>${esc(r.title)}${r.choice?` <em>· ${esc(r.choice)}</em>`:""}<br><em class="num">시작 후 ${fmt(r.at)}</em></span></div>`).join("")}</div>

function placePlain(f){

function josa(word, withBat, noBat){
  const w = (word || "").trim().replace(/\([^)]*\)\s*$/, "").trim();   // 「인파(혼잡)」 → 「인파」
  const c = (w || word || " ").trim().slice(-1).charCodeAt(0);
  if (isNaN(c) || c < 0xAC00 || c > 0xD7A3) return withBat + "(" + noBat + ")";
  return ((c - 0xAC00) % 28) ? withBat : noBat;

function isKeyStep(r){

  if (/현장 출동|출동 확인|장비 휴대 출동|착용 출동|장비 챙기기|초기대응팀 가동/.test(t)) return true;
  if (/영업재개 준비 확인|준비 완료 보고|응급구호 및 대피유도/.test(t)) return true;
  if (r.choice) return true;                                   // 결과를 고른 단계
  if (/119.*도착|도착.*119|구조대|소방/.test(t)) return true;
  if (/완전진화|진화 여부|진압|상황종료|조치 여부|구출|완화 확인|급전/.test(t)) return true;
  if (/초기진화|화재현장 119 인계|냉각/.test(t)) return true;
  if (/무정차|출구 폐쇄|단전|소화전/.test(t)) return true;
  if (/영업재개 준비/.test(t)) return true;
  if (/^영업재개$/.test(t)) return true;
  if (/운행중단|운행 정상|운행재개/.test(t)) return true;

/**
 * 상황보고 경위용 문구 — 직원1 혼자가 아니라 역 전체가 한 일로 적는다
 *  "초기진화 결과 확인 (초기진화 완료)"  →  "초기진화 완료"
 *  "직원②③ 현장 출동 확인"              →  "직원②③ 현장 출동"

function rptLine(r){
  const c = (r.choice || "").trim();
  if (r.rpt) return r.rpt + (c ? ` (${c})` : "");
  // 결과를 고른 단계는 고른 내용만 적는다
  if (/현장 상황은\?/.test(r.title)) return /기능실/.test(c) ? c : "";   // 일반 진화는 다음 단계와 겹쳐 생략
  if (c && /결과 확인|결과는\?|됐나요\?|했나요\?|구출 상황은\?/.test(r.title))
    return c.replace(/^진화 중 · 119 필요$/, "초기진화 미완료 · 119 요청");
  if (c && /배터리 상태/.test(r.title)) return "배터리 " + c.replace(/ 가능$/, "").replace(/^대형 또는 초기진화 불가$/, "대형 · 초기진화 불가");
  if (c && /사상자 상태/.test(r.title)) return "사상자 상태 : " + c;
  if (c && /유형은\?/.test(r.title)) return "PSD " + c;
  // 직접 한 일은 「확인」을 떼고, 결과를 알아본 일(여부·완전진화 등)은 그대로 둔다
  const t = /여부|완전 진화|재실|급전|장애내용|복구 완료/.test(r.title)

  return t + (c ? ` (${c})` : "");

/** 직원②③이 보낸 기록을 읽어 들인다 */
function mergeLog(text){
  if (!text) return 0;
  const run = S.run; run.ext = run.ext || [];
  let who = "";
  let n = 0;
  text.split("\n").forEach(line => {
    const h = line.match(/직원\s*([1-9])\s*조치 기록/);
    if (h){ who = h[1]; return; }
    const m = line.match(/^\s*-\s*(\d{1,2}):(\d{2})\s*:\s*(.+?)\s*$/);
    if (!m) return;
    const t = `${m[1].padStart(2,"0")}:${m[2]}`;
    const txt = m[3].replace(/^\(직원\d\)\s*/, "");
    if (/^(황금시간|30분|1시간|2시간|작성 직원|총 소요시간)/.test(txt)) return;   // 특이사항 줄은 제외
    if (run.ext.some(x => x.t === t && x.txt === txt)) return;                    // 같은 줄은 한 번만
    run.ext.push({t, who: who || "?", txt}); n++;
  });
  return n;
}
function rptParts(){
  const run = S.run, sc = SCENARIOS.find(x => x.id === run.scn);
  const f = run.info;
  const station = S.station ? S.station + "역" : "○○역";

  const detail = placePlain(f);

  /* 보고문에 쓰는 이름 (화면 이름과 다르게 다듬는다) */
  const RPT_NAME = {fire:"화재", battery:"보조배터리 화재", crowd:"역사 내 혼잡", el:"E/L 갇힘 사고",
                    psd:"승강장안전문 장애", tunnel:"승객 비상핸들(코크) 취급", blackout:"대규모 정전",

  const name = run.scn === "crash" && kindTxt ? `열차 ${kindTxt}` : (RPT_NAME[run.scn] || sc.name);
  const rows = Object.values(run.done).filter(r => !r.sys && !r.skip).sort((a,b) => a.at - b.at);
  const end = run.finished || Date.now();
  const did = re => rows.some(r => re.test(r.title));
  /* 119가 실제로 왔는지 — 「119 도착…」 단계를 건너뛰지 않고 마쳤을 때만 */
  const came119 = rows.some(r => /119.*도착|도착.*119/.test(r.title) && !/출동 안 함|해당 없음/.test(r.choice || ""));

  /* ── 조치 결과 (제목 괄호 안) ── */
  const tags = [];
  const rep119 = rows.some(r => /119/.test(r.title) && /신고/.test(r.title));
  if (came119) tags.push("119 출동");
  else if (rep119) tags.push("119 신고 · 미출동");

  if (run.flags.fire === "out") tags.push("초기진화 완료");
  else if (run.flags.fire === "hydrant") tags.push("소화전 사용");
  else if (run.flags.fire === "abort") tags.push("진화 중단·대피유도");

  if (run.flags.batt === "small") tags.push("냉각 조치");
  else if (run.flags.batt === "big") tags.push("119 진화");
  if (did(/^영업재개$/)) tags.push("영업재개");

  /* 1 제목 */
  const title = (run.train ? "[훈련] " : "") + `${line ? line + " " : ""}${station} ${name} 발생` + (tags.length ? ` (${tags.join(" / ")})` : "");

  /* 2 사고개요 — 한 문장으로 */
  const where = [station, detail].filter(Boolean).join(" ");
  let sum = (run.train ? "[불시훈련] " : "") + `${dateFull(run.start)}경 ${where}에서 ${name}${josa(name,"이","가")} 발생`;
  /* 조치한 일을 차례로 잇고, 마지막만 「~함.」으로 맺는다 */
  const acts = [];
  if (run.flags.fire === "out") acts.push("소화기로 초기진화");
  else if (run.flags.fire === "hydrant") acts.push("초기진화를 시도하였으나 실패하여 소화전 사용");
  else if (run.flags.fire === "abort") acts.push("화재가 확산되어 진화를 중단하고 승객 대피 우선 실시");
  if (run.flags.nostop === true) acts.push("관제에 무정차 통과 요청");
  if (did(/출구 폐쇄|폐쇄 완료/)) acts.push("경찰 협조로 출구 폐쇄");
  if (run.flags.el === "done") acts.push("갇힌 승객 구출");
  else if (run.flags.el === "fail") acts.push("구출 작업 진행");
  if (run.flags.psd) acts.push("PSD 장애 조치");
  if (run.flags.batt === "small") acts.push("소형 보조배터리를 물속에 넣어 냉각 조치");
  else if (run.flags.batt === "big") acts.push("대형 배터리로 폭발 위험이 있어 직접 조치하지 않고 승객 대피 우선 실시");
  const fireLike = run.scn === "fire" || run.flags.burn === true;
  if (came119) acts.push(fireLike ? "119 출동하여 화재 진압" : "119 출동하여 구조·구급 조치");
  else if (did(/상황 종료 통보/)) acts.push("자체 진화 완료로 119 출동 취소");
  else if (did(/완전진화|진압/)) acts.push("화재 진압");
  if (did(/^영업재개$/)) acts.push("영업재개");
  if (acts.length){
    const last = acts.pop();
    sum += "하여 " + (acts.length ? acts.join("하였고, ") + "하였으며, " : "") + last + "함.";
  } else sum += "함.";

  /* 3 발생경위 — 핵심만 */
  const key = rows.filter(isKeyStep);
  const mine = (key.length ? key : rows).filter(r => rptLine(r)).map(r => ({t:hm(r.wall), s:`- ${hm(r.wall)} : ${rptLine(r)}`}));
  const got = (run.ext || []).map(x => ({t:x.t, s:`- ${x.t} : (직원${x.who}) ${x.txt}`}));
  const tl = [`- ${hm(run.start)} : ${[detail, name].filter(Boolean).join(" ")} 발생`]
    .concat(mine.concat(got).sort((a,b) => a.t.localeCompare(b.t)).map(x => x.s));
  const allMine = rows.filter(r => rptLine(r)).map(r => ({t:hm(r.wall), s:`- ${hm(r.wall)} : ${rptLine(r)}`}));
  const tlAll = [`- ${hm(run.start)} : ${[detail, name].filter(Boolean).join(" ")} 발생`]
    .concat(allMine.concat(got).sort((a,b) => a.t.localeCompare(b.t)).map(x => x.s));

  /* 4 특이사항 */
  const etc = BANDS.map((bd, k) => {
    const ds = rows.filter(r => r.band === k); if (!ds.length) return null;
    const last = Math.max(...ds.map(r => r.at));
    return `- ${bd.label} : ${last <= bd.limit ? "기한 내 완료" : "기한 초과"} (${fmt(last)})`;
  }).filter(Boolean);
  etc.push(`- 작성 직원 : 직원${run.r} (${run.n}명 근무)`);
  etc.push(`- 총 소요시간 : ${fmt(elapsed())} (${hm(run.start)} ~ ${hm(end)})`);

  return {title, sum, timeline: tl.join("\n"), timelineAll: tlAll.join("\n"), etc: etc.join("\n")};
}
function reportText(all){
  const rs = allRuns();
  if (rs.length < 2){
    const r = rptParts();
    return ["[ 제목 ]", r.title, "", "[ 사고개요 ]", r.sum, "",
            "[ 발생경위 및 조치내용 ]", all ? r.timelineAll : r.timeline, "",
            "[ 특이사항 ]", r.etc].join("\n");
  }
  /* 두 가지 이상 상황이 함께 일어난 경우 */
  const keep = S.run;
  const parts = rs.map(x => { S.run = x; return {run:x, p:rptParts()}; });
  S.run = keep;
  const station = S.station ? S.station + "역" : "○○역";
  const line = S.station ? (linesOf(S.station)[0] || "") : "";
  const names = parts.map(x => x.p.title.replace(/^\[훈련\] /, "").replace(/^\S*호선 /, "").replace(station + " ", "").replace(/ 발생.*$/, ""));
  const tags = [...new Set(parts.flatMap(x => (x.p.title.match(/\(([^)]*)\)$/) || ["",""])[1].split(" / ").filter(Boolean)))];
  const title = (rs[0].train ? "[훈련] " : "") + `${line ? line + " " : ""}${station} ${names.join("·")} 발생` + (tags.length ? ` (${tags.join(" / ")})` : "");

  /* 발생경위 : 모든 상황의 줄을 시각으로 섞는다 */
  const lines2 = [];
  parts.forEach(({run:x, p}) => {
    const sc = SCENARIOS.find(y => y.id === x.scn);
    const tag = `[${SHORT[sc.id] || sc.name}] `;
    (all ? p.timelineAll : p.timeline).split("\n").forEach(l => {
      const m = l.match(/^- (\d{2}):(\d{2}) : (.*)$/);
      if (m) lines2.push({k:+m[1]*60 + +m[2], t:`- ${m[1]}:${m[2]} : ${tag}${m[3]}`});
    });
  });
  lines2.sort((a,b) => a.k - b.k);

  const etc = parts.map(({run:x, p}) => {
    const sc = SCENARIOS.find(y => y.id === x.scn);
    return `· ${sc.name}\n` + p.etc.split("\n").map(l => "  " + l).join("\n");
  }).join("\n");

  return ["[ 제목 ]", title, "",
          "[ 사고개요 ]", ...parts.map(x => x.p.sum), "",
          "[ 발생경위 및 조치내용 ]", ...lines2.map(x => x.t), "",
          "[ 특이사항 ]", etc].join("\n");
}
function copyText(t){
  const msg = copyText.msg || "복사했습니다";
  copyText.msg = null;
  const a = NATIVE(); if (a){ try{ a.copy(t); toast(msg); return; }catch(e){} }
  const done = () => toast(msg);
  try{ navigator.clipboard.writeText(t).then(done, fallback); }catch(e){ fallback(); }
  function fallback(){ const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast("복사하지 못했습니다"); } a.remove(); }
}

/** 매뉴얼 「개인별 조치임무」 표를 그대로 그린다 */
/** 표의 한 줄과 지금 단계가 같은 내용인지 */
function sameLine(line, keys){
  // 표의 기호(▪ - ※ 등)와 괄호 안 설명을 걷어내고 비교한다
  const norm = t => String(t)
      .replace(/^[\s▪·\-※*]+/, "")          // 머리기호
      .replace(/\([^)]*\)/g, "")             // 괄호 설명
      .replace(/관제센터/g, "관제")            // 같은 말로
      .replace(/수보\(보고\)|수보 또는 보고/g, "보고")
      .replace(/피해(상황|내용|내용 등|상황 등)/g, "상황")
      .replace(/[\s,，·]/g, "")
      .replace(/확인$|지속$/, "");
  const a = norm(line); if (a.length < 3) return false;
  return keys.some(k => {
    const b = norm(k); if (b.length < 3) return false;
    return a.indexOf(b) >= 0 || b.indexOf(a) >= 0;
  });
}
function tableHTML(key, here){

  const hit = (txt) => here && txt && sameLine(txt, here);
  return `<div class="mtbl-wrap"><p class="mtbl-t">${esc(T.title)}</p>

      <td class="c-d">${r.d.map(x => `<span class="${hit(x) ? "on" : ""}">${esc(x)}</span>`).join("")}${r.n ? `<span class="nn">${esc(r.n)}</span>` : ""}</td>

  if (S.run && S.run.finished && !liveRuns().length){ S.runs = []; S.run = null; save(); }
  renderHome();
  if (S.run) toast("임무는 계속 기록됩니다 · 홈에서 이어서 하세요");
}
window.appBack = function(){
  if (!$("#sheet").hidden){ closeSheet(); return true; }
  if (screen === "role"){ renderHome(); return true; }
  if (screen === "run"){ goHome(); return true; }
  if (screen === "done"){ S.runs = []; S.run = null; save(); renderHome(); return true; }
  return false;
};
load(); applyTheme();
if (applyPreset()) save();   // 역 게시 비상연락망으로 빈 칸 채우기
if (S.run && !S.run.finished) renderRun(true); else if (S.run && S.run.finished) renderDone(); else renderHome();
</script>
</body>
</html>
